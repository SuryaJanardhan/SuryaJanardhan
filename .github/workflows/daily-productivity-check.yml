name: Daily productivity check

on:
  schedule:
    - cron: "15 18 * * *" # daily at 18:15 UTC (23:45 IST)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get today's date (IST)
        id: date
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, time, timezone
          from zoneinfo import ZoneInfo
          
          ist = ZoneInfo("Asia/Kolkata")
          now_ist = datetime.now(ist)
          today = now_ist.date()
          start = datetime.combine(today, time(0, 0, 0), tzinfo=ist).astimezone(timezone.utc)
          end = now_ist.astimezone(timezone.utc)
          
          print(f"TODAY={today.isoformat()}")
          print(f"START_UTC={start.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          print(f"END_UTC={end.strftime('%Y-%m-%dT%H:%M:%SZ')}")
          PY

      - name: Count commits today (all repos)
        id: count
        env:
          USER_PAT: ${{ secrets.USER_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          if [ -z "$USER_PAT" ]; then
            echo "Missing secret USER_PAT. Add a personal access token (repo scope) as secret USER_PAT." >&2
            exit 1
          fi
          if [ -z "$GH_USER" ]; then
            echo "Missing repository owner to evaluate commit activity." >&2
            exit 1
          fi
          QUERY="author:${GH_USER} committer-date:${START_UTC}..${END_UTC}"
          RESPONSE=$(curl -sS -G \
            -H "Authorization: Bearer $USER_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "q=$QUERY" \
            --data-urlencode "per_page=1" \
            "https://api.github.com/search/commits" \
            -w "\n%{http_code}")
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "GitHub API request failed with status $STATUS." >&2
            echo "$BODY" >&2
            exit 1
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "Missing jq; unable to parse GitHub API response." >&2
            exit 1
          fi
          if ! echo "$BODY" | jq -e . >/dev/null; then
            echo "GitHub API response is not valid JSON; cannot determine commit count." >&2
            echo "$BODY" >&2
            exit 1
          fi
          if ! echo "$BODY" | jq -e 'has("total_count")' >/dev/null; then
            echo "GitHub API response missing total_count field; cannot determine commit count." >&2
            echo "$BODY" >&2
            exit 1
          fi
          COUNT=$(echo "$BODY" | jq -r '.total_count')
          if [ "$COUNT" = "null" ]; then
            echo "GitHub API response total_count is null; cannot determine commit count." >&2
            echo "$BODY" >&2
            exit 1
          fi
          if ! [[ "$COUNT" =~ ^[0-9]+$ ]]; then
            echo "GitHub API response returned non-numeric total_count: $COUNT" >&2
            echo "$BODY" >&2
            exit 1
          fi
          echo "commits=$COUNT" >> $GITHUB_OUTPUT
          echo "COUNT=$COUNT" >> $GITHUB_ENV

      - name: Send email reminder if no commits today
        if: steps.count.outputs.commits == '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ Productivity Alert: No commits on ${{ env.TODAY }}"
          to: chintalajanardhan2004@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          headers: |
            Content-Type: text/html; charset=UTF-8
          body: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <style>
                body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background-color: #f5f5f5;
                  margin: 0;
                  padding: 0;
                }
                .container {
                  max-width: 600px;
                  margin: 20px auto;
                  background-color: #ffffff;
                  border-radius: 8px;
                  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                  overflow: hidden;
                }
                .header {
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  color: white;
                  padding: 30px;
                  text-align: center;
                }
                .header h1 {
                  margin: 0;
                  font-size: 24px;
                  font-weight: 600;
                }
                .header p {
                  margin: 8px 0 0 0;
                  font-size: 14px;
                  opacity: 0.9;
                }
                .content {
                  padding: 30px;
                  color: #333;
                }
                .greeting {
                  font-size: 16px;
                  margin-bottom: 20px;
                }
                .alert-box {
                  background-color: #fff3cd;
                  border-left: 4px solid #ffc107;
                  padding: 15px;
                  margin: 20px 0;
                  border-radius: 4px;
                }
                .alert-box p {
                  margin: 0;
                  color: #856404;
                  font-weight: 500;
                }
                .stats {
                  background-color: #f8f9fa;
                  padding: 15px;
                  border-radius: 4px;
                  margin: 20px 0;
                  text-align: center;
                }
                .stats-number {
                  font-size: 28px;
                  font-weight: bold;
                  color: #667eea;
                }
                .stats-label {
                  font-size: 12px;
                  color: #666;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                }
                .cta {
                  background-color: #667eea;
                  color: white;
                  padding: 12px 30px;
                  border-radius: 4px;
                  text-align: center;
                  margin: 20px 0;
                  display: inline-block;
                  text-decoration: none;
                  font-weight: 500;
                }
                .footer {
                  background-color: #f8f9fa;
                  padding: 20px;
                  text-align: center;
                  font-size: 12px;
                  color: #666;
                  border-top: 1px solid #e9ecef;
                }
              </style>
            </head>
            <body>
              <div class="container">
                <div class="header">
                  <h1>⚠️ Productivity Check</h1>
                  <p>Daily Activity Report</p>
                </div>
                <div class="content">
                  <div class="greeting">
                    Hey <strong>${{ github.repository_owner }}</strong>,
                  </div>
                  <div class="alert-box">
                    <p>🚨 No commits were detected for <strong>${{ env.TODAY }}</strong></p>
                  </div>
                  <p>
                    This is an automated productivity reminder. It looks like you haven't pushed any commits today. 
                    Remember, consistent contributions are key to building great things!
                  </p>
                  <div class="stats">
                    <div class="stats-number">0</div>
                    <div class="stats-label">Commits Today</div>
                  </div>
                  <p>
                    Consider working on one of your projects or fixing that bug you've been thinking about. 
                    Every commit counts! 💪
                  </p>
                </div>
                <div class="footer">
                  <p>This is an automated message sent by your productivity check workflow.</p>
                  <p style="margin: 8px 0 0 0; font-size: 11px;">
                    Last checked: ${{ env.END_UTC }}
                  </p>
                </div>
              </div>
            </body>
            </html>
